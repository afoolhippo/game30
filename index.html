<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>放課後つみつみ消しゴム</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="titleScreen" class="screen active">
    <img src="title.png" id="titleImage" alt="放課後つみつみ消しゴム">

    <div class="ruleBox">
      どうぶつや野菜の消しゴムを<br>
      高く積もう！<br><br>
      崩れるとゲームオーバー！
    </div>

    <button id="startBtn">タップしてスタート</button>
  </div>

  <div id="gameScreen" class="screen">
    <div id="topUI">
      <div id="heightText">0.0m</div>
      <button id="backBtn">タイトルへ戻る</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="controlArea">
      <button id="leftBtn">←</button>
      <button id="dropBtn">落下</button>
      <button id="rightBtn">→</button>
    </div>
  </div>

  <div id="resultScreen" class="screen">
    <img id="resultImage" src="result_bad.png" alt="結果">
    <div id="resultScore">0.0m</div>

    <div id="resultButtons" class="resultButtons hidden">
      <button id="shareButton" class="resultButton">Xでシェア</button>
      <button id="registerButton" class="resultButton">記録を登録</button>
      <button id="retryButton" class="resultButton">もう1回遊ぶ</button>
      <button id="arcadeButton" class="resultButton">カバゲーセンへ</button>
    </div>
  </div>

  <audio src="bgm.mp3" id="bgm" loop></audio>
  <audio src="drop.mp3" id="dropSe"></audio>
  <audio src="hit.mp3" id="hitSe"></audio>
  <audio src="collapse.mp3" id="collapseSe"></audio>

  <script src="game.js?v=20260528-2"></script>
</body>
</html>
